{% extends "base.html" %}

{% block title %}403 Forbidden - RunbookOS{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-12 col-md-6 text-center">
        <div class="d-inline-flex p-4 rounded-circle bg-warning-subtle text-warning mb-3">
            <i class="bi bi-shield-slash fs-1"></i>
        </div>
        <h1 class="display-5 fw-bold text-white mb-2">403 - Access Denied</h1>
        <p class="text-muted mb-4">You do not have the required permissions (Admin or Runbook Owner) to perform this action.</p>
        <a href="{{ url_for('web.dashboard') }}" class="btn btn-primary-devops">
            <i class="bi bi-speedometer2 me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
